[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation for legacy bank back-office apps: LLM discovery, deterministic replay"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "playwright>=1.47",
  "anthropic>=0.60",
  "flask>=3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cua = "cua.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua", "mockbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["live: needs ANTHROPIC credentials and calls the real model"]
addopts = "-m 'not live'"
